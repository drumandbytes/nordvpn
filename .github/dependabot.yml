version: 2
updates:

  - package-ecosystem: "gomod"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Base images only; the nordvpn package is unpinned on purpose (see the Dockerfile).
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    # `ci(deps):` — CI-only, no image change, so no release.
    commit-message:
      prefix: "ci"
      include: "scope"
