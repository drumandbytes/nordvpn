version: 2
updates:

  - package-ecosystem: "gomod"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Base image bumps (golang:1.27-trixie, debian:trixie-slim). The NordVPN
  # package itself is deliberately unpinned in the Dockerfile (always
  # installs whatever's current) - see the Dockerfile's own comment - so
  # this only tracks the two pinned upstream images, not that package.
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Grouped into a single PR so related action bumps land together rather than
  # as a stream of separate PRs. Auto-merge handles them once CI passes.
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    # `ci(deps):` — CI-only, no image change, so no release.
    commit-message:
      prefix: "ci"
      include: "scope"
