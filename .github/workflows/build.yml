name: Build

on:
  push:
    branches: [main]
    # Release-please tags — publishes the immutable semver image (see the meta step).
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      # CI-config-only changes (Dependabot config, the auto-merge/validate
      # workflows themselves) don't touch the image - no need for a full
      # multi-arch build+push on every one of them. build.yml is explicitly
      # re-included: a change to the workflow that actually builds and
      # pushes the image should still be exercised for real, not skipped.
      # (Tag pushes ignore path filters, so releases always build.)
      - '.github/**'
      - '!.github/workflows/build.yml'
  # No cron. The weekly rebuild used to live here and published images that only
  # `latest` and a date tag could name — unselectable by a semver constraint and
  # recorded by no release. upstream-check.yml now watches the actual inputs
  # (client version, base image digests, apt dependency versions) and opens a PR
  # when one moves, so the same drift arrives as a normal commit-driven release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/drumandbytes/nordvpn
          tags: |
            # main pushes: the rolling convenience tag only
            type=raw,value=latest,enable={{is_default_branch}}
            # release-please tags: immutable pinned versions
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Signed SLSA build provenance for the pushed image, stored next to it
      # in GHCR as an OCI referrer. Verify with:
      #   gh attestation verify oci://ghcr.io/drumandbytes/nordvpn:latest --owner drumandbytes
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/drumandbytes/nordvpn
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
