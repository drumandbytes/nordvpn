name: Build

on:
  push:
    # Release tags only. Every published image is now a release, and exactly one
    # build produces it.
    #
    # main pushes used to build and push too, which meant each change was built
    # twice -- once for `latest` on merge, once for the semver tags on the
    # release -- and since apt installs are unpinned those two builds produced
    # different images from the same commit. Nothing recorded what `latest`
    # contained. The path filters that used to live here existed to stop that
    # duplicate build firing on doc and CI edits; with no main-push build there
    # is nothing to filter.
    #
    # Main pushes are still exercised: validate.yml builds the image as a smoke
    # test on every PR. It just does not publish.
    tags: ['v*.*.*']
  # No cron. The weekly rebuild used to live here and published images that only
  # `latest` and a date tag could name — unselectable by a semver constraint and
  # recorded by no release. upstream-check.yml now watches the actual inputs
  # (client version, base image digests, apt dependency versions) and opens a PR
  # when one moves, so the same drift arrives as a normal commit-driven release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per architecture, each on a runner of that architecture. arm64 was
  # previously cross-built under QEMU on an amd64 runner, which dominated build
  # time -- this image installs a full apt dependency tree and compiles Go, and
  # emulating all of that is far slower than running it natively. Public repos
  # get ubuntu-24.04-arm at no cost, so the emulation bought nothing.
  #
  # Neither job tags anything. Each pushes an untagged, digest-addressed image
  # and hands the digest to the merge job, which is what assembles the tags into
  # a single manifest list. Tagging here would mean two builds racing for the
  # same tag, with the loser silently discarded.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags come from the merge job.
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/drumandbytes/nordvpn

      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/drumandbytes/nordvpn,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          # The digest arrives as sha256:<hex>; the bare hex is used as a
          # filename so the merge job can glob them without parsing.
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"
        shell: bash

      - uses: actions/upload-artifact@v6.0.0
        with:
          # One artifact per platform, merged by name pattern below. Slashes are
          # not valid in artifact names.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-architecture images into one manifest list and puts the
  # tags on that. This is the only job that tags, and the only one that attests:
  # the attestation names the manifest list, which is what a consumer pulls.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo

    steps:
      - uses: actions/download-artifact@v6.0.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/drumandbytes/nordvpn
          # latest=auto applies `latest` to the semver tag builds only, so it
          # always names the newest release.
          #
          # It used to be applied on main pushes instead, which meant `latest`
          # and the release tags were different builds of the same commit --
          # and because apt installs are unpinned, genuinely different images.
          # 1.0.2 was sha256:0679f53... while latest was sha256:6e36d4c...,
          # with nothing recording what latest contained. Same failure the date
          # tags had: a published image no release could name.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/drumandbytes/nordvpn@%s ' *)
        shell: bash

      # imagetools create does not report the digest of what it just pushed, and
      # the attestation below needs one. Every tag resolves to the same manifest
      # list, so read it back from the first.
      - name: Read back the manifest list digest
        id: manifest
        run: |
          ref=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "manifest list $ref is $digest"
        shell: bash

      # Signed SLSA build provenance for the manifest list, stored next to it in
      # GHCR as an OCI referrer. Verify with:
      #   gh attestation verify oci://ghcr.io/drumandbytes/nordvpn:latest --owner drumandbytes
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/drumandbytes/nordvpn
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
