name: Build

on:
  push:
    # Release tags only: every published image is a release, built once.
    # validate.yml builds the image on every PR without publishing.
    tags: ['v*.*.*']
  # No cron: upstream-check.yml opens a PR when an input moves.
  # No workflow_dispatch: tags come only from type=semver, so a branch run
  # would push untagged images and fail.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One native job per architecture (QEMU was far slower). Each pushes an
  # untagged image by digest; only the merge job tags, so builds can't race.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags come from the merge job.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/drumandbytes/nordvpn

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/drumandbytes/nordvpn,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          # upload-artifact rejects ':', so the bare hex digest is the filename.
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v7.0.1
        with:
          # One artifact per platform; slashes aren't valid in names.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-arch images into one manifest list, then tags and attests it.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/drumandbytes/nordvpn
          # latest=auto puts `latest` on release tags only, so it's always the newest release.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/drumandbytes/nordvpn@sha256:%s ' *)
        shell: bash

      # imagetools create doesn't output the digest the attestation needs;
      # read it back from the first tag.
      - name: Read back the manifest list digest
        id: manifest
        run: |
          ref=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "manifest list $ref is $digest"
        shell: bash

      # SLSA provenance, stored next to the image in GHCR. Verify with:
      #   gh attestation verify oci://ghcr.io/drumandbytes/nordvpn:latest --owner drumandbytes
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/drumandbytes/nordvpn
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
