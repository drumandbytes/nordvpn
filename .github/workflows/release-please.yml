name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # dnb-robot App token, not GITHUB_TOKEN: the release PR merge and the tag
      # push have to get past protecting-main's ruleset, which only bypasses
      # for this installed App (see drumandbytes/dnb-tf rulesets.tf).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: 4773076
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Merging the release PR tags vX.Y.Z; build.yml builds & pushes it as a
      # semver-tagged image. Immutable tags — no floating vN.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
