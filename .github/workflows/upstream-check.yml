name: Upstream check

# Watches every image input (scripts/upstream-lock.sh) and opens a PR when
# one moves; release-please and build.yml turn it into a release.

on:
  schedule:
    - cron: "0 5 * * *" # daily; only opens a PR when something actually changed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: true  # this workflow pushes with the checkout's credentials
          token: ${{ steps.app-token.outputs.token }}

      # imagetools resolves the base image digests without pulling the images.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: check
        run: |
          ./scripts/upstream-lock.sh > /tmp/upstream.lock.new
          echo "--- resolved upstream inputs ---"
          cat /tmp/upstream.lock.new

          # No lock file yet means first run; the PR seeds it.
          if [ -f upstream.lock ] && diff -q upstream.lock /tmp/upstream.lock.new >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing moved upstream"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            [ -f upstream.lock ] && diff upstream.lock /tmp/upstream.lock.new || true
          fi

          # The client version titles the PR when it's what moved.
          awk -F= '/^nordvpn=/{print "client="$2}' /tmp/upstream.lock.new >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLIENT: ${{ steps.check.outputs.client }}
        run: |
          BRANCH="upstream/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "dnb-robot[bot]"
          git config user.email "4773076+dnb-robot[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          cp /tmp/upstream.lock.new upstream.lock
          echo "$CLIENT" > .nordvpn-version

          git add upstream.lock .nordvpn-version
          git commit -m "fix(deps): upstream inputs changed (client ${CLIENT})"
          git push -u origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "fix(deps): upstream inputs changed (client ${CLIENT})" \
            --body "$(printf 'One or more upstream inputs moved. Merging cuts a patch release and rebuilds the image.\n\n```diff\n%s\n```\n' "$(git diff HEAD~1 -- upstream.lock | tail -n +5)")"
