name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# No paths-ignore: a filtered-out run never reports required-checks-passed,
# which the ruleset requires, so the PR could never merge.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: drumandbytes/reusable-actions/.github/workflows/go-ci.yml@v1
    with:
      dockerfile-path: Dockerfile

  # The GHCR prune graph logic against a fixture. Untested, it once deleted
  # reachable attestations (#21, #23).
  prune-ghcr-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/prune-ghcr.sh --self-test

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          load: true
          tags: nordvpn:smoke-test

      # Smoke test: with nothing configured, nordvpnd starts and `nordvpn status`
      # answers. Full paths: distroless has no PATH.
      - name: Container survives with no config
        run: |
          docker run -d --name smoke-test nordvpn:smoke-test
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
            echo "Container exited early with nothing configured:"
            docker logs smoke-test
            exit 1
          fi
          docker exec smoke-test /usr/bin/nordvpn status
          docker exec smoke-test /usr/sbin/iptables --version
          docker exec smoke-test /usr/sbin/ip -V
          docker exec smoke-test /usr/bin/wg --version
          docker rm -f smoke-test

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [lint, prune-ghcr-self-test, smoke-test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
