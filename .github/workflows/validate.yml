name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# No paths-ignore here on purpose: this workflow hosts required-checks-passed,
# which the org's branch ruleset requires by name on every PR. A path filter
# on the workflow trigger means GitHub never even starts the run for an
# excluded diff (e.g. a docs-only PR) -- not "skipped", just never reported --
# so the ruleset's required check sits at "Expected" forever and the PR can't
# merge. Filter what runs inside jobs (paths-filter, changed-files, etc.) if
# needed, never the trigger.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; no job here writes to the repo or reads other scopes.
permissions:
  contents: read

jobs:
  lint:
    uses: drumandbytes/reusable-actions/.github/workflows/go-ci.yml@v1
    with:
      dockerfile-path: Dockerfile

  # #21/#23: the GHCR prune script deleted reachable attestation data once
  # already because its reachability algorithm went untested. This is what
  # should have caught that before it ran against the real package -- no
  # gh, no docker, no network, just the graph logic against a fixed fixture.
  prune-ghcr-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/prune-ghcr.sh --self-test

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          load: true
          tags: nordvpn:smoke-test

      # No token, no capabilities, no meshnet/connect — just proves the
      # entrypoint doesn't crash the container outright (nordvpnd starts,
      # `nordvpn status` responds) with nothing configured. This is exactly
      # the scenario that shipped broken before the entrypoint stopped
      # letting a failed login/connect/meshnet command kill the daemon —
      # see the "fix: don't let a failed login/connect/meshnet command
      # kill the daemon" commit for the real-world incident that prompted
      # this test. Full binary paths throughout — distroless, no PATH
      # assumptions.
      - name: Container survives with no config
        run: |
          docker run -d --name smoke-test nordvpn:smoke-test
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
            echo "Container exited early with nothing configured:"
            docker logs smoke-test
            exit 1
          fi
          docker exec smoke-test /usr/bin/nordvpn status
          docker exec smoke-test /usr/sbin/iptables --version
          docker exec smoke-test /usr/sbin/ip -V
          docker exec smoke-test /usr/bin/wg --version
          docker rm -f smoke-test

  # Audit of this repo's own workflows; accepted findings are in
  # .github/zizmor.yml.
  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [lint, prune-ghcr-self-test, smoke-test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
